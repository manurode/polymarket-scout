scanner:
  events_limit: 25
  markets_per_event: 8
  min_volume: 5000

tracker:
  db_path: "data/polymarket.db"
  retention_days: 90

signals:
  momentum:
    threshold: 0.03
    window_hours: 1
  volume_spike:
    threshold: 2.0
    window_hours: 24
  spread:
    tight_threshold: 0.02
    wide_threshold: 0.08
  new_interest:
    min_volume: 10000

scorer:
  alert_threshold: 35
  cooldown_minutes: 30

alerter:
  platform: "telegram"
  bot_token: "8784149244:AAFbc2DNhAlAZAs2rNgGR2dMIwJiqIaB1WQ"
  chat_id: "6031819"

auto_trader:
  enabled: true
  max_open_positions: 10
  position_size_pct: 0.05
  min_score: 30
  enabled_strategies:
    - momentum_follow
    - contrarian
    - consensus_breakout
    - volume_breakout
  exit_strategy:
    take_profit_pct: 0.10       # +10% → cierra con ganancia
    stop_loss_pct: 0.20         # -20% → corta pérdidas
    trailing_activate_pct: 0.08 # si llega a +8%, activa trailing stop
    trailing_sl_pct: 0.0        # ...y sube el SL a break-even (0%)
    max_hold_hours: 48           # cierra si tras 48h no se ha movido

selection:
  top_n: 50
  weights:
    volume: 0.40
    liquidity: 0.30
    recency: 0.20
    spread: 0.10

rate_limiter:
  total_rate: 0.4               # tokens/segundo (~4 req CLOB / 10s)
  max_burst: 2.0                # capacidad máxima de tokens acumulables
