    window_hours: 24
  spread:
    tight_threshold: 0.02
    wide_threshold: 0.08
  new_interest:
    min_volume: 10000

scorer:
  alert_threshold: 35
  cooldown_minutes: 30

alerter:
  platform: "telegram"
  bot_token: "8784149244:AAFbc2DNhAlAZAs2rNgGR2dMIwJiqIaB1WQ"
  chat_id: "6031819"

auto_trader:
  enabled: true
  max_open_positions: 25
  position_size_pct: 0.05
  min_score: 30
