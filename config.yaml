# ── v2.0 Modules ──────────────────────────────────────────────

radar:
  interval_seconds: 60           # polling interval for Gamma Radar

websocket:
  url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  heartbeat_interval: 30
  reconnect_delay_base: 1.0
  reconnect_delay_max: 30.0

market_making:
  base_multiplier: 1.0
  max_obi: 0.95
  reentry_delay_seconds: 30
  # v2.0: Inventory & Risk Parameters
  max_inventory: 10000           # USD max para skew completo
  skew_risk_factor: 0.5          # factor de riesgo del skew (0-1)
  obi_spread_widen_threshold: 0.8  # |OBI| > 0.8 → ensanchar spread
  obi_spread_widen_factor: 1.5   # multiplicador del spread OBI
  toxic_flow_volume_ratio: 3.0   # ratio volumen 1min / media 20min
  toxic_flow_pause_duration: 60  # segundos de pausa por flujo tóxico

time_decay:
  base_inventory_cap: 500         # USD
  transition_point: 0.70
  risk_floor: 0.05
  min_liquidity: 10000

portfolio:
  k_base: 0.25                    # Quarter Kelly
  ruin_limit: 0.02                # 2% max loss per trade
  epoch_hours: 6
  probation_epochs: 4
  recovery_allocation: 0.04       # v2.0: 4% del capital durante RECOVERY
  recovery_trades_required: 10    # v2.0: trades necesarios para evaluar salida de RECOVERY
  hurdle_rate: 0.20               # 20% annualized minimum

whale_tracker:
  alpha_threshold: 0.85
  min_transactions: 50
  whale_factor: 0.40

degradation:
  auto_recover: true
  recovery_timeout: 300            # 5 minutes

redis:
  url: "redis://localhost:6379"

# ── NLP Oracle — Real-Time Sentiment Validator ─────────────────────
# Validador de contexto externo (coste cero, baja latencia) para la
# estrategia momentum_follow. Usa ingestión Telegram + Zero-Shot NLI
# para validar que los spikes de volumen L2 tienen respaldo noticioso.

nlp_oracle:
  enabled: true                   # Master switch. Activar tras configurar .env
  # [!] telegram_api_id y telegram_api_hash se leen del .env
  #     (TELEGRAM_API_ID / TELEGRAM_API_HASH). NUNCA en este archivo.
  channels:                        # Canales de Telegram a monitorizar (sin @)
    - "WalterBloomberg"
    - "WatcherGuru"
    # - "polymarket_news"
  model: "facebook/bart-large-mnli"  # Modelo NLI Zero-Shot (~1.6GB)
  # Alternativas más ligeras:
  #   "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"  (~700MB)
  #   "typeform/distilbert-base-uncased-mnli"          (~268MB)
  nlp_confidence_threshold: 0.65    # Score mínimo para aprobar señal (0-1)
  buffer_ttl_seconds: 900           # TTL de titulares en buffer (15 min)
  buffer_max_size: 200              # Máximo de titulares en memoria
